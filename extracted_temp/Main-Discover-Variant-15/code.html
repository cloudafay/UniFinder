<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>UniFinder - Discover</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Icons -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1337ec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101322",
                        "surface-dark": "#191e33",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "2xl": "2rem", "3xl": "2.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .glass-panel {
            background: rgba(25, 30, 51, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-button {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark text-white font-display overflow-hidden select-none">
<!-- Background Layer: Campus Night Gradient -->
<div class="fixed inset-0 z-0 pointer-events-none">
<!-- Deep base -->
<div class="absolute inset-0 bg-[#101322]"></div>
<!-- Gradient Blobs -->
<div class="absolute top-[-10%] left-[-20%] w-[80%] h-[60%] rounded-full bg-blue-900/30 blur-[100px]"></div>
<div class="absolute bottom-[10%] right-[-10%] w-[70%] h-[50%] rounded-full bg-indigo-900/20 blur-[80px]"></div>
<div class="absolute top-[40%] left-[30%] w-[40%] h-[40%] rounded-full bg-purple-900/20 blur-[90px]"></div>
<!-- Texture Overlay -->
<div class="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20 brightness-100 contrast-150 mix-blend-overlay" data-alt="Subtle noise texture overlay"></div>
</div>
<div class="relative z-10 flex flex-col h-screen w-full max-w-md mx-auto">
<!-- Top App Bar -->
<div class="flex items-center justify-between p-4 pt-6">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-white text-[28px]">school</span>
<h1 class="text-xl font-bold tracking-tight text-white">UniFinder</h1>
</div>
<button class="glass-button h-10 w-10 flex items-center justify-center rounded-full text-white active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]">tune</span>
</button>
</div>
<!-- Main Content Area: Stacked Card & Actions -->
<div class="flex-1 flex flex-col items-center justify-center px-4 pb-24 relative w-full">
<!-- Floating Profile Card -->
<div class="relative w-full aspect-[3/4] max-h-[65vh] rounded-[32px] overflow-hidden shadow-[0_20px_50px_-12px_rgba(0,0,0,0.5)] group">
<!-- Main Image -->
<div class="absolute inset-0 bg-center bg-cover bg-no-repeat transition-transform duration-700 group-hover:scale-105" data-alt="Portrait of a female university student smiling naturally with soft campus lighting in background" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuC9Bp4S9gI_RIJaEgDLGzmkVzgA-qXrdT-Rca7Lre9vI7yNpqaEQWJh_ZNCYDabOkUVzh95Il1pfhAkbHq3wfppoY6pirHquovPJyjx_tzMKeY8bI6lCgZb6ULaWjcVXqUzpkkLZGwYbecZCIJIHsLlUH1-SGbfB8WAJMwZG4pgvQTDhIiBKA4bgpLHjL0M_zuXxqe3Ua47-AhpLb8AcazEsV_A6wDYGlmM-8cKQ3dhlUojSoXYXzJ61ootK4l0hoUZTLISK-OcSmOT");'>
</div>
<!-- Safety Shield Icon -->
<button class="absolute top-4 right-4 glass-button h-10 w-10 flex items-center justify-center rounded-full text-white/90 hover:bg-white/20 transition-colors z-20">
<span class="material-symbols-outlined text-[20px]">shield</span>
</button>
<!-- Gradient Overlay for Legibility -->
<div class="absolute inset-0 bg-gradient-to-t from-[#101322] via-transparent to-transparent opacity-80"></div>
<!-- Glass Info Overlay -->
<div class="absolute bottom-4 left-4 right-4 glass-panel rounded-2xl p-4 flex flex-col gap-3">
<!-- Name & Age -->
<div class="flex items-end justify-between">
<div class="flex flex-col">
<div class="flex items-center gap-2">
<h2 class="text-2xl font-bold text-white leading-tight">Sarah, 21</h2>
<span class="material-symbols-outlined text-primary text-[20px]" title="Verified Student">verified</span>
</div>
<p class="text-gray-300 text-sm font-medium mt-1">Psychology Major • Senior</p>
</div>
</div>
<!-- Tags (Chips) -->
<div class="flex flex-wrap gap-2">
<div class="flex items-center gap-1 bg-white/10 px-3 py-1.5 rounded-lg backdrop-blur-sm">
<span class="material-symbols-outlined text-[14px] text-primary">school</span>
<span class="text-xs font-medium text-white">Study Buddy</span>
</div>
<div class="flex items-center gap-1 bg-white/10 px-3 py-1.5 rounded-lg backdrop-blur-sm">
<span class="material-symbols-outlined text-[14px] text-amber-400">local_cafe</span>
<span class="text-xs font-medium text-white">Coffee Lover</span>
</div>
</div>
</div>
</div>
<!-- Reaction Controls: Unique Cluster Arrangement -->
<!-- Positioned to overlap the bottom of the card slightly or sit just below -->
<div class="absolute bottom-[100px] w-full flex justify-center items-end pointer-events-none z-30 translate-y-4">
<div class="relative w-full max-w-[280px] h-[100px] pointer-events-auto">
<!-- Super Like (Top Center of Triangle) -->
<button class="absolute left-1/2 -translate-x-1/2 top-0 flex flex-col items-center gap-1 group">
<div class="glass-button h-12 w-12 rounded-full flex items-center justify-center text-blue-400 shadow-lg shadow-blue-900/20 group-hover:scale-110 transition-all duration-300 group-hover:bg-blue-500/20 border-blue-400/30">
<span class="material-symbols-outlined text-[24px] font-variation-FILL-1">star</span>
</div>
</button>
<!-- Pass (Left Bottom) -->
<button class="absolute left-4 bottom-2 flex flex-col items-center gap-1 group">
<div class="glass-button h-16 w-16 rounded-full flex items-center justify-center text-red-400 shadow-lg shadow-red-900/20 group-hover:scale-110 transition-all duration-300 group-hover:bg-red-500/20 border-red-400/30">
<span class="material-symbols-outlined text-[32px]">close</span>
</div>
</button>
<!-- Like (Right Bottom - Primary Action) -->
<button class="absolute right-4 bottom-2 flex flex-col items-center gap-1 group">
<div class="h-16 w-16 rounded-full bg-primary flex items-center justify-center text-white shadow-xl shadow-primary/40 group-hover:scale-110 transition-all duration-300 group-active:scale-95">
<span class="material-symbols-outlined text-[32px] font-variation-FILL-1">favorite</span>
</div>
</button>
</div>
</div>
</div>
<!-- Bottom Navigation Bar (Floating Pill) -->
<div class="fixed bottom-6 left-0 right-0 px-6 z-40 flex justify-center">
<nav class="glass-panel w-full max-w-[340px] rounded-full px-6 py-3 flex items-center justify-between shadow-2xl shadow-black/40">
<a class="flex flex-col items-center gap-1 group w-12" href="#">
<div class="relative text-primary transition-colors">
<span class="material-symbols-outlined text-[28px] font-variation-FILL-1">explore</span>
<span class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-1 h-1 bg-primary rounded-full"></span>
</div>
</a>
<a class="flex flex-col items-center gap-1 group w-12" href="#">
<div class="relative text-gray-400 hover:text-white transition-colors">
<span class="material-symbols-outlined text-[28px]">chat_bubble</span>
</div>
</a>
<a class="flex flex-col items-center gap-1 group w-12" href="#">
<div class="relative text-gray-400 hover:text-white transition-colors">
<span class="material-symbols-outlined text-[28px]">person</span>
</div>
</a>
<a class="flex flex-col items-center gap-1 group w-12" href="#">
<div class="relative text-gray-400 hover:text-white transition-colors">
<span class="material-symbols-outlined text-[28px]">notifications</span>
<!-- Notification Dot -->
<span class="absolute top-0 right-0 w-2.5 h-2.5 bg-red-500 border-2 border-[#191e33] rounded-full"></span>
</div>
</a>
</nav>
</div>
</div>
</body></html>
