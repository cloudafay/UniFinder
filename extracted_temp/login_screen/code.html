<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>UniFinder Login</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1337ec",
                        "primary-dark": "#0b25a8",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101322",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem", 
                        "lg": "2rem", 
                        "xl": "3rem", 
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        /* Custom Blur for that extra glassy feel */
        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }
        
        .dark .glass-card {
            background: rgba(16, 19, 34, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Ambient Glow Animation */
        @keyframes float {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        
        .ambient-glow {
            animation: float 10s ease-in-out infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-white antialiased transition-colors duration-300">
<div class="relative min-h-screen w-full flex items-center justify-center overflow-hidden">
<!-- Abstract Background Elements (Dreamy Blur) -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<!-- Top Right Blob -->
<div class="absolute -top-[10%] -right-[10%] w-[600px] h-[600px] bg-primary/20 rounded-full mix-blend-multiply filter blur-[100px] ambient-glow opacity-70 dark:mix-blend-screen dark:opacity-20"></div>
<!-- Bottom Left Blob -->
<div class="absolute -bottom-[10%] -left-[10%] w-[500px] h-[500px] bg-blue-400/20 rounded-full mix-blend-multiply filter blur-[80px] ambient-glow opacity-70 dark:mix-blend-screen dark:opacity-20" style="animation-delay: 2s"></div>
<!-- Center Accent -->
<div class="absolute top-[20%] left-[30%] w-[300px] h-[300px] bg-purple-300/20 rounded-full mix-blend-multiply filter blur-[60px] ambient-glow opacity-50 dark:mix-blend-screen dark:opacity-10" style="animation-delay: 4s"></div>
</div>
<!-- Main Container -->
<div class="relative z-10 w-full max-w-md px-6">
<!-- Glass Card -->
<div class="glass-card w-full rounded-[2.5rem] p-8 flex flex-col items-center">
<!-- Logo / Header -->
<div class="mb-8 text-center">
<div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-primary/10 text-primary mb-4 shadow-sm border border-primary/10 backdrop-blur-sm">
<span class="material-symbols-outlined text-[32px]">school</span>
</div>
<h1 class="text-slate-900 dark:text-white tracking-tight text-[28px] font-bold leading-tight">UniFinder</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium mt-2">Connect with your Campus</p>
</div>
<!-- Form -->
<form class="w-full flex flex-col gap-5">
<!-- Email Input -->
<div class="w-full">
<label class="block text-slate-700 dark:text-slate-300 text-sm font-semibold mb-2 ml-1">University Email</label>
<div class="relative flex items-center">
<input class="w-full h-14 pl-5 pr-12 rounded-full bg-white/50 dark:bg-white/5 border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all duration-200 backdrop-blur-sm shadow-sm" placeholder="student@university.edu" type="email"/>
<div class="absolute right-4 text-green-500 pointer-events-none flex items-center justify-center opacity-0 has-[:valid]:opacity-100 transition-opacity">
<span class="material-symbols-outlined">check_circle</span>
</div>
</div>
<p class="text-xs text-slate-400 mt-1.5 ml-2 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">info</span>
                            Must use a valid .edu address
                        </p>
</div>
<!-- Password Input -->
<div class="w-full">
<div class="flex justify-between items-center mb-2 ml-1">
<label class="block text-slate-700 dark:text-slate-300 text-sm font-semibold">Password</label>
</div>
<div class="relative flex items-center">
<input class="w-full h-14 pl-5 pr-12 rounded-full bg-white/50 dark:bg-white/5 border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all duration-200 backdrop-blur-sm shadow-sm" placeholder="Enter your password" type="password"/>
<button class="absolute right-4 text-slate-400 hover:text-primary transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<div class="flex justify-end mt-2">
<a class="text-xs font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<!-- Login Button -->
<button class="mt-2 w-full h-14 rounded-full bg-primary hover:bg-primary-dark text-white text-base font-bold tracking-wide shadow-[0_4px_14px_0_rgba(19,55,236,0.39)] hover:shadow-[0_6px_20px_rgba(19,55,236,0.23)] hover:-translate-y-0.5 transition-all duration-300 flex items-center justify-center gap-2 group">
<span>Log In</span>
<span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Footer -->
<div class="mt-8 text-center">
<p class="text-slate-500 dark:text-slate-400 text-sm">
                        New to UniFinder? 
                        <a class="text-primary font-semibold hover:underline" href="#">Apply for access</a>
</p>
</div>
<!-- Trust Badge -->
<div class="mt-6 flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-100/50 dark:bg-slate-800/50 border border-slate-200/50 dark:border-white/5">
<span class="material-symbols-outlined text-slate-400 text-[16px]">verified_user</span>
<span class="text-[10px] uppercase tracking-wider font-bold text-slate-400">Official Campus ID Required</span>
</div>
</div>
<!-- Bottom Disclaimer -->
<p class="text-center text-xs text-slate-400 dark:text-slate-600 mt-6 font-medium">
                Protected by reCAPTCHA and subject to the Privacy Policy and Terms of Service.
            </p>
</div>
</div>
</body></html>
